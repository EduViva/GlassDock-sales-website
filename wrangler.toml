name = "glassdock"
main = "src/worker.js"
compatibility_date = "2026-10-01"
# o envio de e-mail pelo Gmail (worker-mailer) usa sockets TCP
compatibility_flags = ["nodejs_compat"]

# Páginas estáticas (public/). O worker roda antes delas para tratar /api, /baixar e os links de indicação
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "drop-trailing-slash"

[vars]
SUPABASE_URL = "https://hzqpfxpvsaezixlxtkab.supabase.co"
PRICE_CENTS = "1190"
COMMISSION_PERCENT = "50"
# dias de espera antes de a comissão entrar na fila da segunda-feira (prazo de arrependimento)
HOLD_DAYS = "7"
# nome do arquivo no bucket "releases" do Supabase
EXE_KEY = "GlassDock.exe"
# horas de validade de cada link de download (e-mail e página de pagamento)
DOWNLOAD_HOURS = "24"
# validade do QR code do PIX (mínimo 30 minutos)
PIX_EXPIRATION = "PT30M"
# Segredos (Cloudflare › Settings › Variables and Secrets, tipo Secret):
# SUPABASE_SECRET_KEY, MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET, ADMIN_KEY
# E-mail: GMAIL_USER + GMAIL_APP_PASSWORD (sem domínio próprio) ou RESEND_API_KEY + EMAIL_FROM (com domínio)
